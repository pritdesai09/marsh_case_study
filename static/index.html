<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marsh Pitch Generator</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/js/api.js" defer></script>
  <script src="/static/js/ui.js" defer></script>
  <script src="/static/js/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">M</span>
      <div>
        <h1>Pitch Generator</h1>
        <p>AI-generated, audit-verified insurance pitches</p>
      </div>
    </div>
    <span id="mode-badge" class="badge">Connecting…</span>
  </header>

  <main class="container">
    <section class="card">
      <div class="card-head">
        <div>
          <h2>Policy knowledge base</h2>
          <p class="muted">Every benefit the pitch can use, traced to a quote and page in the brochure. Click a policy to inspect its facts.</p>
        </div>
        <span id="store-date" class="muted small"></span>
      </div>
      <ul id="policy-list" class="policy-list"></ul>
    </section>
  </main>
</body>
</html>
